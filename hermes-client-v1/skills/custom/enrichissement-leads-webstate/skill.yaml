name: enrichissement-leads-webstate
version: 1.0.0
description: Enrichit leads via Pappers SIREN + score B2B. Désactivé par défaut.
author: Hermès Platform
category: commercial
license: MIT

triggers:
  - type: cron
    schedule: "*/30 * * * *"  # toutes les 30 min
  - type: webhook
    path: /leads/enrich
    method: POST

inputs:
  lead_id: { type: string, required: false }
  batch_limit: { type: integer, default: 20 }

outputs:
  enriched_count: integer
  skipped_count: integer
  errors: array

requires:
  llm: stepfun/step-3.5-flash
  skills_required: [crm-webstate]

disable_when_env_missing:
  - WEBSTATE_REFRESH_TOKEN

enabled_by_default: false

costs:
  per_invocation_eur: 0.001
  notes: "1-3 calls Pappers via Edge Fn Webstate, gratuit jusqu'à 250/mois"
